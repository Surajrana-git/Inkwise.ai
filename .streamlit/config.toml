[theme]
base = "light"
primaryColor = "#12917F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
textColor = "#1B2A4E"

[client]
toolbarMode = "minimal"
# our own header has the page tabs; never flash Streamlit's default page list
showSidebarNavigation = false

[server]
maxUploadSize = 5
# images in app/static are served as files, so the page styles stay small and load at once
enableStaticServing = true
